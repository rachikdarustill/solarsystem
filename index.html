<style>
  :root{
    --ink:#2f394d; --muted:#5b6476; --slate:#505d75;
    --orange:#e95c20; --bg:#f4f6f9; --surface:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:18px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .page{min-height:100vh;min-height:100dvh;display:flex;padding:16px}
  .card{
    flex:1; display:flex; flex-wrap:wrap; gap:16px;
    max-width:1240px; margin:auto; width:100%;
  }
  .main{
    flex:1.4 1 520px; min-width:0;
    background:var(--surface); border-radius:32px;
    padding:clamp(28px,5vw,64px);
    display:flex; flex-direction:column; justify-content:space-between; gap:clamp(40px,8vh,96px);
  }
  .logo{display:block;width:min(420px,100%);height:auto}
  .content{display:flex;flex-direction:column;gap:24px}
  h1{
    margin:0; font-family:'Unbounded',sans-serif; font-weight:500;
    font-size:clamp(30px,4vw,56px); line-height:1.08; letter-spacing:-.03em;
    hyphens:auto; -webkit-hyphens:auto; overflow-wrap:break-word;
  }
  h1 span{color:var(--orange)}
  p{margin:0;color:var(--muted);font-size:clamp(17px,1.5vw,20px);max-width:560px}
  .actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
  .phone{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--orange); color:#fff; text-decoration:none;
    font-weight:700; font-size:18px; white-space:nowrap;
    padding:14px 24px; border-radius:999px;
    transition:background-color .2s;
  }
  .phone:hover{background:#d14f17}
  .phone:focus-visible{outline:3px solid var(--slate);outline-offset:3px}
  .phone svg{width:20px;height:20px;flex:none}
  .status{
    display:inline-flex; align-items:center; gap:10px;
    background:#e9edf3; color:var(--ink); font-weight:600; font-size:14px;
    padding:10px 16px; border-radius:999px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--orange);
    animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .photo{
    flex:1 1 380px; min-width:0; min-height:320px; margin:0;
    border-radius:32px; overflow:hidden; background:#dfe4ec; position:relative;
  }
  .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 40%;display:block}
  @media (max-width:900px){ .photo{min-height:0;aspect-ratio:4/3;flex-basis:100%} }
  @media (prefers-reduced-motion:reduce){ .dot{animation:none} }
</style>
